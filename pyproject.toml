[project]
name = "local-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Winkler", email = "christian.winkler@datanizing.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "openai>=3.49.0",
    "pandas>=3.1.1",
    "pip>=26.3",
    "sentence-transformers[image]>=6.3.0",
    "spacy>=3.8.18",
    "tantivy>=0.27.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
    "usearch>=2.26.6",
    "vllm>=0.2.5",
]

[project.scripts]
local-env = "local_env:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
